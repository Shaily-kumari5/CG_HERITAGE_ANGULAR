<div class="profile-container">

  <h2>Profile Form</h2>

  <input
    type="text"
    placeholder="Enter Name"
    [(ngModel)]="name"
    (input)="markDirty()">

  <br><br>

  <input
    type="email"
    placeholder="Enter Email"
    [(ngModel)]="email"
    (input)="markDirty()">

  <br><br>

  <input
    type="text"
    placeholder="Enter Phone"
    [(ngModel)]="phone"
    (input)="markDirty()">

  <br><br>

  <div class="buttons">

    <button (click)="save()">
      Save Profile
    </button>

    <button (click)="goBack()">
      Back To Dashboard
    </button>

  </div>

</div>
