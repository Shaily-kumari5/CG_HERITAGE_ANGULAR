<div class="student-container">

  <h1>Student List</h1>

  <ul>
    <li *ngFor="let student of students">

      <a [routerLink]="['/students', student.id]">
        {{ student.name }}
      </a>

    </li>
  </ul>

  <br>

  <button (click)="goToDashboard()">
    Back To Dashboard
  </button>

</div>
