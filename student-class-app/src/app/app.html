<div class="background">

  <div class="student-card">

    <div class="header">
      <h1>🎓 Student Information</h1>
      <p>Class, Object & Template Literal Example</p>
    </div>

    <div class="details">

      <div class="row">
        <span>ID</span>
        <strong>{{ student.id }}</strong>
      </div>

      <div class="row">
        <span>Name</span>
        <strong>{{ student.name }}</strong>
      </div>

      <div class="row">
        <span>Course</span>
        <strong>{{ student.course }}</strong>
      </div>

    </div>

    <div class="template-box">

      <h3>Output using Template Literal</h3>

      <pre>{{ studentDetails }}</pre>

    </div>

  </div>

</div>
